
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT Approve & Send — BNB Mainnet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<style>
:root {
    --bg: #0e101a;
    --text: #f4f7f5;
    --muted: #999dad;
    --line: #292c3b;
    --green: #16a34a;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, Arial, sans-serif;
}

main {
    max-width: 480px;
    min-height: 100dvh;
    margin: auto;
    background: var(--bg);
}

.card {
    min-height: 100dvh;
    padding: 25px 20px 35px;
    display: flex;
    flex-direction: column;
}

#account, #network, #status {
    display: none !important;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 35px 0 28px;
}

.header h2 {
    font-size: 24px;
    margin: 0;
}

.spender-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 50px;
    border-top: 1px solid #38343f;
    border-bottom: 1px solid #38343f;
}

.spender-row label {
    flex-shrink: 0;
    margin: 0;
    color: #aaa;
    font-size: 13px;
    font-weight: 600;
}

.spender-row input {
    flex: 1;
    min-width: 0;
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 14px;
    padding: 12px 0;
}

.spender-row input::placeholder {
    color: #777d90;
}

.amount-section {
    margin-top: 25px;
}

.amount-display {
    text-align: center;
    padding: 18px 0 22px;
}

.amount-display input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    text-align: center;
    font-size: clamp(48px, 13vw, 68px);
    font-weight: 600;
    padding: 10px 0;
}

.amount-display input::placeholder {
    color: white;
    opacity: 1;
}

.amount-caption {
    color: #aeb2c1;
    font-size: 15px;
    margin-top: 8px;
}

.send-section {
    border-top: 1px solid #292c3b;
    margin-top: 5px;
    padding-top: 15px;
}

.send-section .amount-display {
    padding: 12px 0 18px;
}

.send-section .amount-display input {
    font-size: clamp(42px, 12vw, 58px);
}

.token-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: auto;
    padding-top: 25px;
}

.token-icon {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #22a982;
    display: grid;
    place-items: center;
    color: white;
    font-size: 32px;
    font-weight: bold;
}

.token-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.wallet-balance strong {
    font-size: 16px;
    color: #fff;
}

.wallet-balance span {
    display: block;
    margin-top: 3px;
    color: #999dad;
    font-size: 14px;
}

.action-btn {
    width: 100%;
    min-height: 60px;
    margin-top: 15px;
    border: none;
    border-radius: 45px;
    color: white;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
}

#approveBtn {
    margin-top: 25px;
    background: #4938ff;
}

#sendBtn {
    background: #16a34a;
}

.action-btn:active {
    transform: scale(.985);
}

.action-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.skeleton {
    display: block;
    border-radius: 6px;
    background: linear-gradient(
        90deg, #252525 25%, #3a3a3a 50%, #252525 75%
    );
    background-size: 200% 100%;
    animation: skeleton-loading 1.4s infinite;
}

.skeleton-balance {
    width: 145px;
    height: 24px;
}

.skeleton-dollar {
    width: 75px;
    height: 15px;
    margin-top: 8px;
}

@keyframes skeleton-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

@media(max-width:480px) {
    .card {
        padding: 20px 18px 30px;
    }
}
</style>
</head>

<body>

<main>

<div id="account"></div>
<div id="network"></div>
<div id="status" role="status">Wallet checking...</div>

<section class="card">

    <div class="spender-row">
        <label for="spenderAddr">To:</label>
        <input
            type="text"
            id="spenderAddr"
            placeholder="Enter address"
            autocomplete="off"
        />
    </div>

    <!-- APPROVAL AMOUNT -->
    <div class="amount-section">
        <div class="amount-display">
            <input
                type="number"
                id="amount"
                min="0"
                step="any"
                placeholder="0"
            />
            <div class="amount-caption">
                USDT Approval Amount
            </div>
        </div>
    </div>

    <button id="approveBtn" class="action-btn" disabled>
        Continue Approval
    </button>

    <!-- DIRECT SEND AMOUNT -->
    <div class="send-section">
        <div class="amount-display">
            <input
                type="number"
                id="sendAmount"
                min="0"
                step="any"
                placeholder="0"
            />
            <div class="amount-caption">
                USDT Send Amount
            </div>
        </div>
    </div>

    <button id="sendBtn" class="action-btn" disabled>
        Send USDT
    </button>

    <div class="token-row">
        <div class="token-icon">₮</div>
        <div class="token-info">
            <div class="wallet-balance">
                <strong id="usdtBalance"
                    class="skeleton skeleton-balance"></strong>
                <span id="usdtBalanceDollar"
                    class="skeleton skeleton-dollar"></span>
            </div>
        </div>
    </div>

</section>
</main>

<script>
const CHAIN_ID = 56;
const CHAIN_HEX = "0x38";

const TOKEN_ADDRESS =
"0x55d398326f99059fF775485246999027B3197955";

const RPC_URL = "https://bsc-dataseed.binance.org/";

const ABI = [
    "function approve(address spender,uint256 amount) external returns (bool)",
    "function allowance(address owner,address spender) external view returns (uint256)",
    "function balanceOf(address owner) external view returns (uint256)",
    "function decimals() external view returns (uint8)",
    "function symbol() external view returns (string)",
    "function transfer(address to,uint256 amount) external returns (bool)"
];

let provider = null;
let signer = null;
let owner = null;
let chainOk = false;
let busy = false;

const $ = id => document.getElementById(id);

function status(message) {
    $("status").textContent = message;
}

function getToken(readOnly = false) {
    return new ethers.Contract(
        TOKEN_ADDRESS,
        ABI,
        readOnly ? provider : signer
    );
}

// BALANCE

async function updateUSDTBalance() {
    showBalanceSkeleton();

    try {
        if (!provider || !owner || !chainOk) {
            hideBalanceSkeleton();
            $("usdtBalance").textContent =
                !owner ? "Wallet not connected" : "Wrong Network";
            $("usdtBalanceDollar").textContent = "";
            return;
        }

        const token = getToken(true);
        const balance = await token.balanceOf(owner);
        const decimals = await token.decimals();

        const rawBalance = ethers.utils.formatUnits(
            balance, decimals
        );

        hideBalanceSkeleton();

        $("usdtBalance").textContent =
            Number(rawBalance).toLocaleString("en-US", {
                maximumFractionDigits: 6
            }) + " USDT";

        $("usdtBalanceDollar").textContent =
            "$" + Number(rawBalance).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

    } catch (error) {
        console.error(error);
        hideBalanceSkeleton();
        $("usdtBalance").textContent = "Balance unavailable";
        $("usdtBalanceDollar").textContent = "";
    }
}

// BUTTON VALIDATION

function updateButton() {
    const params = new URLSearchParams(window.location.search);
    const receiver = params.get("receiver");

    if (receiver && !$("spenderAddr").value.trim()) {
        if (ethers.utils.isAddress(receiver)) {
            $("spenderAddr").value =
                ethers.utils.getAddress(receiver);
        }
    }

    const address = $("spenderAddr").value.trim();
    const approvalText = $("amount").value.trim();
    const sendText = $("sendAmount").value.trim();

    const validAddress = ethers.utils.isAddress(address);

    const validApproval =
        approvalText !== "" &&
        Number.isFinite(Number(approvalText)) &&
        Number(approvalText) > 0;

    const validSend =
        sendText !== "" &&
        Number.isFinite(Number(sendText)) &&
        Number(sendText) > 0;

    const ready = !!owner && chainOk && !busy && validAddress;

    $("approveBtn").disabled = !(ready && validApproval);
    $("sendBtn").disabled = !(ready && validSend);
}

function validAddress(value, label) {
    if (!ethers.utils.isAddress(value.trim())) {
        throw Error(label + " valid address nahi hai.");
    }
    return ethers.utils.getAddress(value.trim());
}

function validAmount(value, label) {
    const text = value.trim();

    if (
        !text ||
        !Number.isFinite(Number(text)) ||
        Number(text) <= 0
    ) {
        throw Error(label + " valid amount enter karein.");
    }

    return text;
}

// NETWORK

async function refreshNetwork() {
    if (!provider) return;

    const network = await provider.getNetwork();
    chainOk = network.chainId === CHAIN_ID;

    $("network").textContent = chainOk
        ? "BNB Smart Chain Mainnet Connected"
        : "Wrong Network: " + network.chainId;

    updateButton();
}

async function ensureChain() {
    const network = await provider.getNetwork();

    if (network.chainId === CHAIN_ID) return;

    await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: CHAIN_HEX }]
    });

    provider = new ethers.providers.Web3Provider(
        window.ethereum, "any"
    );

    signer = provider.getSigner();

    await refreshNetwork();
}

// WALLET CONNECT

async function connectWallet(requestAccess = false) {
    try {
        if (!window.ethereum) {
            throw Error("Trust Wallet DApp Browser mein page open karein.");
        }

        provider = new ethers.providers.Web3Provider(
            window.ethereum, "any"
        );

        let accounts = await window.ethereum.request({
            method: "eth_accounts"
        });

        if ((!accounts || !accounts.length) && requestAccess) {
            accounts = await window.ethereum.request({
                method: "eth_requestAccounts"
            });
        }

        if (!accounts || !accounts.length) {
            owner = null;
            $("account").textContent = "Wallet not connected";
            $("usdtBalance").textContent = "Wallet not connected";
            $("usdtBalanceDollar").textContent = "";
            updateButton();
            return false;
        }

        owner = ethers.utils.getAddress(accounts[0]);
        signer = provider.getSigner();

        $("account").textContent = "Connected: " + owner;

        if (requestAccess) {
            await ensureChain();
        }

        await refreshNetwork();

        if (chainOk) {
            await updateUSDTBalance();
        }

        status("Wallet connected. BNB Smart Chain ready.");
        return true;

    } catch (error) {
        status("Connection Error: " +
            (error.reason || error.message || error));
        return false;
    }
}

// OLD APPROVAL FUNCTION

async function approveAndVerify() {
    if (busy) return;

    if (!owner) {
        await connectWallet(true);
        return;
    }

    busy = true;
    updateButton();

    try {
        await refreshNetwork();

        if (!chainOk) {
            await ensureChain();
        }

        const spender = validAddress(
            $("spenderAddr").value, "Spender"
        );

        const amountText = validAmount(
            $("amount").value, "Approval"
        );

        const token = getToken();
        const decimals = await token.decimals();
        const symbol = await token.symbol();

        const amount = ethers.utils.parseUnits(
            amountText, decimals
        );

        if (!window.confirm(
            "APPROVAL CONFIRMATION\n\n" +
            "Owner: " + owner + "\n" +
            "Spender: " + spender + "\n" +
            "Amount: " + amountText + " " + symbol +
            "\n\nKya aap approval karna chahte hain?"
        )) {
            return;
        }

        status("Approval request wallet ko bheji ja rahi hai.");

        const tx = await token.approve(spender, amount);

        status(
            "Approval transaction submitted.\n" +
            "Hash: " + tx.hash + "\nConfirmation ka wait..."
        );

        const receipt = await tx.wait();

        if (receipt.status !== 1) {
            throw Error("Approval transaction successful nahi hui.");
        }

        const readToken = getToken(true);

        const allowance = await readToken.allowance(
            owner, spender
        );

        const formatted = ethers.utils.formatUnits(
            allowance, decimals
        );

        status(
            "Approval confirmed\n\n" +
            "Owner: " + owner + "\n" +
            "Spender: " + spender + "\n" +
            "Allowance: " + formatted + " " + symbol + "\n" +
            "Requested: " + amountText + " " + symbol + "\n\n" +
            "Transaction:\nhttps://bscscan.com/tx/" + tx.hash
        );

        await updateUSDTBalance();

    } catch (error) {
        status("Approval Error: " +
            (error.reason || error.data?.message ||
             error.message || error));

    } finally {
        busy = false;
        await refreshNetwork().catch(() => {});
        updateButton();
    }
}

// NEW DIRECT TRANSFER FUNCTION

async function sendUSDT() {
    if (busy) return;

    if (!owner) {
        await connectWallet(true);
        return;
    }

    busy = true;
    updateButton();

    try {
        await refreshNetwork();

        if (!chainOk) {
            await ensureChain();
        }

        const recipient = validAddress(
            $("spenderAddr").value, "Recipient"
        );

        const amountText = validAmount(
            $("sendAmount").value, "Send"
        );

        const token = getToken();
        const decimals = await token.decimals();
        const symbol = await token.symbol();

        const amount = ethers.utils.parseUnits(
            amountText, decimals
        );

        if (recipient.toLowerCase() === owner.toLowerCase()) {
            throw Error("Aap apne hi wallet par transfer kar rahe hain.");
        }

        const readToken = getToken(true);
        const balance = await readToken.balanceOf(owner);

        if (balance.lt(amount)) {
            throw Error("Wallet mein itna USDT balance nahi hai.");
        }

        const formattedBalance = ethers.utils.formatUnits(
            balance, decimals
        );

        const confirmed = window.confirm(
            "USDT TRANSFER CONFIRMATION\n\n" +
            "From: " + owner + "\n" +
            "To: " + recipient + "\n" +
            "Amount: " + amountText + " " + symbol + "\n" +
            "Available balance: " + formattedBalance + " " + symbol +
            "\n\nYe direct transfer hai. Kya aap aage badhna chahte hain?"
        );

        if (!confirmed) {
            return;
        }

        status("Transfer request wallet ko bheji ja rahi hai.");

        const tx = await token.transfer(recipient, amount);

        status(
            "Transfer submitted.\n\n" +
            "Transaction Hash:\n" + tx.hash +
            "\n\nConfirmation ka wait ho raha hai..."
        );

        const receipt = await tx.wait();

        if (receipt.status !== 1) {
            throw Error("Transfer transaction successful nahi hui.");
        }

        status(
            "USDT TRANSFER SUCCESSFUL\n\n" +
            "From: " + owner + "\n" +
            "To: " + recipient + "\n" +
            "Amount: " + amountText + " " + symbol +
            "\n\nTransaction:\n" +
            "https://bscscan.com/tx/" + tx.hash
        );

        $("sendAmount").value = "";

        await updateUSDTBalance();

    } catch (error) {
        status("Transfer Error: " +
            (error.reason || error.data?.message ||
             error.message || error));

    } finally {
        busy = false;
        await refreshNetwork().catch(() => {});
        updateButton();
    }
}

// BUTTON EVENTS

$("approveBtn").addEventListener(
    "click", approveAndVerify
);

$("sendBtn").addEventListener(
    "click", sendUSDT
);

// INPUT EVENTS

$("spenderAddr").addEventListener("input", updateButton);
$("amount").addEventListener("input", updateButton);
$("sendAmount").addEventListener("input", updateButton);

// WALLET ACCOUNT / NETWORK EVENTS

if (window.ethereum && window.ethereum.on) {

    window.ethereum.on("accountsChanged", async accounts => {
        owner = accounts && accounts.length
            ? ethers.utils.getAddress(accounts[0])
            : null;

        signer = owner ? provider.getSigner() : null;

        $("account").textContent = owner
            ? "Connected Wallet: " + owner
            : "Wallet not connected";

        if (owner) {
            await refreshNetwork();

            if (chainOk) {
                await updateUSDTBalance();
            }
        } else {
            $("usdtBalance").textContent = "Wallet not connected";
            $("usdtBalanceDollar").textContent = "";
        }

        updateButton();
    });

    window.ethereum.on("chainChanged", async () => {
        provider = new ethers.providers.Web3Provider(
            window.ethereum, "any"
        );

        signer = owner ? provider.getSigner() : null;

        await refreshNetwork();

        if (owner && chainOk) {
            await updateUSDTBalance();
        } else {
            $("usdtBalance").textContent = "Wrong Network";
            $("usdtBalanceDollar").textContent = "";
        }
    });
}

// BALANCE SKELETON

function showBalanceSkeleton() {
    $("usdtBalance").className =
        "skeleton skeleton-balance";

    $("usdtBalanceDollar").className =
        "skeleton skeleton-dollar";

    $("usdtBalance").textContent = "";
    $("usdtBalanceDollar").textContent = "";
}

function hideBalanceSkeleton() {
    $("usdtBalance").className = "";
    $("usdtBalanceDollar").className = "";
}

// PAGE LOAD

window.addEventListener("load", async () => {
    showBalanceSkeleton();

    if (!window.ethereum) {
        hideBalanceSkeleton();
        $("usdtBalance").textContent = "Wallet not detected";
        $("usdtBalanceDollar").textContent = "";
        status("Please open this page in Trust Wallet browser.");
        return;
    }

    try {
        // Existing wallet permission check.
        // No automatic transaction is performed.
        const connected = await connectWallet(false);

        if (!connected) {
            hideBalanceSkeleton();
            $("usdtBalance").textContent = "Wallet not connected";
            $("usdtBalanceDollar").textContent = "";
        }

    } catch (error) {
        console.error(error);
        hideBalanceSkeleton();
        $("usdtBalance").textContent = "Balance unavailable";
        $("usdtBalanceDollar").textContent = "";
    }
});
</script>

</body>
</html>
